[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-appsec"
version = "0.1.1"
description = "Discovers authenticated path-parameter endpoints from OpenAPI and detects broken object-level authorization (BOLA/IDOR)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
sentinel = "sentinel_appsec.cli:main"

[project.urls]
Homepage = "https://github.com/ankush-exe/Sentinel"
Repository = "https://github.com/ankush-exe/Sentinel"